# Réglages par défaut de toute session Spark lancée depuis Jupyter.
# SparkSession.builder.getOrCreate() se connecte donc au cluster, pas au mode local.

spark.master                      spark://spark-master:7077
spark.driver.memory               1g
spark.executor.memory             768m

# Les chemins sans préfixe désignent HDFS : spark.read.csv("/brut/ventes.csv").
spark.hadoop.fs.defaultFS         hdfs://namenode:8020

# Une partition de lecture par bloc HDFS de 16 Mo, comme un split par bloc en MapReduce.
# Sans ce réglage, Spark découpe selon le nombre de cœurs et les fichiers de 128 Mo au plus.
spark.sql.files.maxPartitionBytes 16777216

# Ce sont les clients qui fixent la taille des blocs et le nombre de copies
# des fichiers qu'ils écrivent : on aligne Spark sur la configuration du cluster.
spark.hadoop.dfs.blocksize        16777216
spark.hadoop.dfs.replication      2
